<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Auniy</title>


<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">


<style>

:root {

    --midnight: #0D1E3D;
    --cream: #F8F5ED;
    --cobalt: #1B3F8B;

}


* {

    margin: 0;
    padding: 0;
    box-sizing: border-box;

}


body {

    height: 100vh;

    background: var(--cream);

    color: var(--midnight);

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Helvetica, Arial, sans-serif;

}


.container {

    display: flex;

    align-items: center;

    gap: 90px;

    padding: 40px;

}


.text {

    max-width: 430px;

}


.number {

    font-family: 'Playfair Display', Georgia, serif;

    font-size: 130px;

    line-height: 1;

    font-weight: 600;

}


.title {

    font-family: 'Playfair Display', Georgia, serif;

    font-size: 32px;

    margin-top: 20px;

}


.description {

    margin-top: 20px;

    color: #555;

    font-size: 16px;

    line-height: 1.8;

}


.back {

    display: inline-block;

    margin-top: 35px;

    padding: 11px 28px;

    border: 1px solid var(--midnight);

    border-radius: 30px;

    color: var(--midnight);

    text-decoration: none;

    font-size: 13px;

    letter-spacing: 0.12em;

    transition: all 0.3s ease;

}


.back:hover {

    background: var(--midnight);

    color: var(--cream);

}



.photo {

    width: 260px;

    height: 260px;

    border-radius: 50%;

    object-fit: cover;

}



@media(max-width:700px) {


    .container {

        flex-direction: column-reverse;

        text-align: center;

        gap: 40px;

    }


    .photo {

        width: 200px;

        height: 200px;

    }


    .number {

        font-size: 100px;

    }


}


</style>

</head>



<body>


<div class="container">


    <div class="text">


        <div class="number">
            404
        </div>


        <div class="title">
            This page cannot be reached.
        </div>


        <div class="description">

            Please check whether your VPN connection is enabled,
            or return to the homepage.

        </div>


        <a class="back" href="index.html">
            BACK HOME
        </a>


    </div>



    <img class="photo"
         src="assets/face-cutout.png"
         alt="Profile photo">


</div>


</body>

</html>
